<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fairyground</title>
    <!--
      The playground used to be split into a play page (index.html) and an
      advanced analysis page (advanced.html). Both are one page now, so this
      only keeps older links and bookmarks working.
    -->
    <link rel="canonical" href="./" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=./" />
    <script>
      // Carry the query string and the fragment over, so that a shared deep
      // link such as advanced.html?variant=shogi keeps its board.
      window.location.replace(
        "./" + window.location.search + window.location.hash,
      );
    </script>
  </head>
  <body>
    <p>
      This page has moved. <a href="./" target="_self">Open fairyground</a>.
    </p>
  </body>
</html>
